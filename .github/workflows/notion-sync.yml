
name: Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and transform Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request
          from datetime import datetime, timezone

          source = "4126fd5d-7856-80f6-ac0d-000ba4d30431"
          url = f"https://api.notion.com/v1/data_sources/{source}/query"

          headers = {
              "Authorization": "Bearer " + os.environ["NOTION_TOKEN"],
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json"
          }

          rows = []
          cursor = None

          while True:
              body = {"page_size": 100}
              if cursor:
                  body["start_cursor"] = cursor

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.load(response)

              rows.extend(result["results"])

              if not result.get("has_more"):
                  break
              cursor = result["next_cursor"]

          def rich_text(prop, key="rich_text"):
              return "".join(
                  part.get("plain_text", "")
                  for part in prop.get(key, [])
              )

          def sales_date(value):
              matches = re.findall(
                  r"(?<!\d)(\d{1,2}\.\d{1,2}\.\d{2,4})(?!\d)",
                  value
              )
              dates = []
              for match in matches:
                  try:
                      fmt = "%d.%m.%y" if len(match.split(".")[-1]) == 2 else "%d.%m.%Y"
                      dates.append(datetime.strptime(match, fmt).date().isoformat())
                  except ValueError:
                      pass
              return dates[0] if len(set(dates)) == 1 else None

          items = []

          for row in rows:
              p = row["properties"]
              status = (p["Status"].get("status") or {}).get("name", "")
              owners = [
                  x["name"] for x in
                  p["Owner"].get("multi_select", [])
              ]
              owners = [
                  {"Mama": "Ulrike", "Papa": "Diethelm"}.get(x, x)
                  for x in owners
              ]

              name = rich_text(p["Item"], "title")
              profit = p["Sales Profit"].get("number")
              minimum = p["Minimum"].get("number")
              best = p["Best Case"].get("number")

              date = sales_date(rich_text(p["Sales Update"]))

              items.append({
                  "id": row["id"],
                  "name": name,
                  "status": status,
                  "owners": owners,
                  "profit": profit,
                  "minimum": minimum,
                  "bestCase": best,
                  "soldDate": date if status == "Sold" else None
              })

          sold = [x for x in items if x["status"] == "Sold"]
          unsold = [x for x in items if x["status"] != "Sold"]

          def number(value):
              return value if value is not None else 0

          revenue = sum(number(x["profit"]) for x in sold)
          minimum = revenue + sum(number(x["minimum"]) for x in unsold)
          best = revenue + sum(number(x["bestCase"]) for x in unsold)

          if any(x["profit"] is None for x in sold):
              raise ValueError("Sold item missing Sales Profit")

          if any(not x["owners"] for x in items):
              raise ValueError("Item missing Owner")

          if any(
              x["minimum"] is None or x["bestCase"] is None
              for x in unsold
          ):
              raise ValueError("Unsold item missing price estimate")

          if any(
              x["minimum"] > x["bestCase"]
              for x in unsold
          ):
              raise ValueError("Minimum exceeds Best Case")

          if len(items) != len(rows):
              raise ValueError("Record count mismatch")

          payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "recordCount": len(items),
              "soldCount": len(sold),
              "revenue": revenue,
              "minimumTotal": minimum,
              "bestCaseTotal": best,
              "items": items
          }

          os.makedirs("data", exist_ok=True)

          with open("data/sales.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print("Records:", len(items))
          print("Sold:", len(sold))
          print("Revenue:", revenue)
          print("Minimum:", minimum)
          print("Best Case:", best)
          print("Sold without date:", sum(
              x["soldDate"] is None for x in sold
          ))
          PY

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sales.json

          if ! git diff --cached --quiet; then
            git commit -m "Update live sales data"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
