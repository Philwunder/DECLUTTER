
name: Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Notion data and inspect schema
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          source = "4126fd5d-7856-80f6-ac0d-000ba4d30431"
          url = f"https://api.notion.com/v1/data_sources/{source}/query"

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json"
          }

          rows = []
          cursor = None

          # Fetch all records, including pagination
          while True:
              body = {"page_size": 100}

              if cursor:
                  body["start_cursor"] = cursor

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              rows.extend(data["results"])

              if not data.get("has_more"):
                  break

              cursor = data["next_cursor"]
          
          from collections import Counter
          import re

          def get_text(prop):
              return "".join(
                  x.get("plain_text", "")
                  for x in prop.get("rich_text", [])
              )

          print("\n=== STATUS VALUES ===")
          print(dict(Counter(
              (r["properties"]["Status"].get("status") or {}).get("name", "EMPTY")
              for r in rows
          )))

          print("\n=== OWNER VALUES ===")
          print(dict(Counter(
              owner["name"]
              for r in rows
              for owner in r["properties"]["Owner"].get("multi_select", [])
          )))

          print("\n=== SALES DATE FORMATS ===")
          for field in ("Sales Update", "Comment"):
              dates = []
              for r in rows:
                  value = get_text(r["properties"][field])
                  dates.extend(re.findall(
                      r"\b\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?\b",
                      value
                  ))
              print(field, Counter(dates).most_common(15))

          print("\n=== SOLD ITEM FIELD COMPLETENESS ===")
          sold = [
              r for r in rows
              if (r["properties"]["Status"].get("status") or {}).get("name", "").lower()
              in ("sold", "verkauft")
          ]
          print("Sold records:", len(sold))
          for field in ("Sales Profit", "Minimum", "Best Case"):
              print(field, sum(
                  r["properties"][field].get("number") is not None
                  for r in sold
              ))

          print("=" * 50)
          print("NOTION CONNECTION SUCCESSFUL")
          print(f"Total records: {len(rows)}")
          print("=" * 50)

          # Inspect property names and types
          print("\nNOTION PROPERTY SCHEMA:")

          if rows:
              properties = rows[0].get("properties", {})

              for name, prop in properties.items():
                  prop_type = prop.get("type", "unknown")
                  print(f"  {name}: {prop_type}")
          else:
              print("No records found.")

          print("=" * 50)

          # Save connection status only
          # No private Notion records are published
          os.makedirs("data", exist_ok=True)

          status = {
              "connected": True,
              "records": len(rows),
              "data_source_id": source
          }

          with open(
              "data/sync-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  status,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("Sync status saved successfully.")
          PY

      - name: Commit sync status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sync-status.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Notion sync status"
            git push
          else
            echo "No changes to commit."
          fi
