
name: Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Notion data and inspect schema
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          source = "4126fd5d-7856-80f6-ac0d-000ba4d30431"
          url = f"https://api.notion.com/v1/data_sources/{source}/query"

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json"
          }

          rows = []
          cursor = None

          # Fetch all records, including pagination
          while True:
              body = {"page_size": 100}

              if cursor:
                  body["start_cursor"] = cursor

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              rows.extend(data["results"])

              if not data.get("has_more"):
                  break

              cursor = data["next_cursor"]

          print("=" * 50)
          print("NOTION CONNECTION SUCCESSFUL")
          print(f"Total records: {len(rows)}")
          print("=" * 50)

          # Inspect property names and types
          print("\nNOTION PROPERTY SCHEMA:")

          if rows:
              properties = rows[0].get("properties", {})

              for name, prop in properties.items():
                  prop_type = prop.get("type", "unknown")
                  print(f"  {name}: {prop_type}")
          else:
              print("No records found.")

          print("=" * 50)

          # Save connection status only
          # No private Notion records are published
          os.makedirs("data", exist_ok=True)

          status = {
              "connected": True,
              "records": len(rows),
              "data_source_id": source
          }

          with open(
              "data/sync-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  status,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("Sync status saved successfully.")
          PY

      - name: Commit sync status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sync-status.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Notion sync status"
            git push
          else
            echo "No changes to commit."
          fi
